name: Deploy to LXC 126

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH → git pull → rebuild landing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "▶ [1/3] Pull frontend..."
            cd /opt/deep-audit-landing
            git pull origin main

            echo "▶ [2/3] Rebuild landing container..."
            cd /opt/deep-audit-knowledge-engine
            /usr/local/bin/docker-compose up -d --build landing

            echo "▶ [3/3] Health check..."
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)
            if [ "$STATUS" != "200" ]; then
              echo "❌ Health check falló — HTTP $STATUS"
              exit 1
            fi
            echo "✅ Deploy OK — HTTP $STATUS"
